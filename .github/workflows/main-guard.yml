name: main guard

# Branch protection should make this unreachable: a red change cannot merge into
# `main`, and direct pushes, force-pushes and deletions are rejected even for
# administrators. This is the backstop for the paths protection cannot see — a
# rule relaxed for a moment, a merge made while the check was bypassed, a push
# from an app with an exemption. A red `main` becomes an issue the same day
# instead of a silent failure.
#
# It listens to the existing CI workflow rather than re-running the gate, so a
# failure costs one API call and no build minutes.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha.slice(0, 7);
            const label = "ci-failure";

            // Created once, on the first failure; 422 means it already exists.
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "b60205",
                description: "main failed the gate",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const body = [
              `\`main\` failed the gate at \`${sha}\`.`,
              "",
              `- Run: ${run.html_url}`,
              `- Commit: ${run.head_sha}`,
            ].join("\n");

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });

            // One issue per incident window: comment on the open one instead of
            // opening a new issue for every subsequent failure.
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `main is red at ${sha}`,
              body,
              labels: [label],
            });
