# nginx config for the Xillow web container.
#
# Serves the built SPA and reverse-proxies /api/* to the `api` service so the
# browser only ever talks to one origin (no CORS needed), mirroring the Vite
# dev proxy.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the Express service on the compose network.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed assets under /assets - cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA shell.
    location / {
        try_files $uri /index.html;
    }
}
