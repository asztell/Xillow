services:
  db:
    image: postgres:18
    container_name: xillow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xillow
      POSTGRES_PASSWORD: xillow
      POSTGRES_DB: xillow
    ports:
      # Host 5433 to avoid clashing with any existing local Postgres on 5432.
      - "5433:5432"
    volumes:
      # Postgres 18 moved the data volume from /var/lib/postgresql/data to
      # /var/lib/postgresql (PGDATA is now /var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
      # Runs once, on first initialisation of an empty data directory.
      - ./apps/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xillow -d xillow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
