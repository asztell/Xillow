# Xillow - local full-stack stack.
#
#   npm run docker:up      # docker compose up --build  (db + api + web)
#
# Brings up Postgres, seeds it once, then serves the API and the built UI.
# Internal traffic uses service names on the compose network; only the published
# ports below are reachable from the host:
#   web -> http://localhost:8080
#   api -> http://localhost:3001
#   db  -> localhost:5433
#
# Host ports default to the values above but can be overridden via the
# API_HOST_PORT / WEB_HOST_PORT / DB_HOST_PORT env vars (e.g. in .env). The API
# default (3001) deliberately differs from the manual `npm run dev` API (3000)
# so both can run at the same time against the shared database on 5433.

services:
  db:
    image: postgres:18
    container_name: xillow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xillow
      POSTGRES_PASSWORD: xillow
      POSTGRES_DB: xillow
    ports:
      # Host 5433 to avoid clashing with any existing local Postgres on 5432.
      # Shared by the Docker stack and manual `npm run dev`.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      # Postgres 18 moved the data volume from /var/lib/postgresql/data to
      # /var/lib/postgresql (PGDATA is now /var/lib/postgresql/18/docker).
      - pgdata:/var/lib/postgresql
      # Runs once, on first initialisation of an empty data directory.
      - ./apps/api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xillow -d xillow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies the schema and loads sample_listings.json, then exits.
  # The API only starts once this completes successfully.
  seed:
    image: xillow-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xillow-seed
    init: true
    restart: "no"
    command: ["node", "apps/api/dist/seed.js"]
    environment:
      DATABASE_URL: &database-url postgres://xillow:xillow@db:5432/xillow
    depends_on:
      db:
        condition: service_healthy

  api:
    image: xillow-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xillow-api
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      PORT: "3001"
    ports:
      # Host 3001 (not 3000) so `npm run dev` can run concurrently.
      - "${API_HOST_PORT:-3001}:3001"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api-go:
    image: xillow-api-go:local
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
    container_name: xillow-api-go
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      PORT: "3000"
    ports:
      # Host 3002 so it runs in parallel with the Node API (host 3001).
      - "${API_GO_HOST_PORT:-3002}:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    image: xillow-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: xillow-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
